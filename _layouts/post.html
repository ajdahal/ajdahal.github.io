<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: page.title }}">
  <title>{{ page.title }} | Arjun Dahal</title>
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  </script>
  <link rel="stylesheet" href="{{ '/css/styles.css?v=20260527-theme2' | relative_url }}">
</head>
<body>
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="{{ '/index.html' | relative_url }}" class="nav-title">Arjun Dahal</a>
    <ul>
      <li><a href="{{ '/research.html' | relative_url }}">Research</a></li>
      <li><a href="{{ '/blogs.html' | relative_url }}" aria-current="page">Blogs</a></li>
      <li><a href="{{ '/cv.html' | relative_url }}">CV</a></li>
    </ul>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">D</span>
      <span class="theme-toggle-text">Dark</span>
    </button>
  </nav>

  <main class="content post-content">
    <article>
      <header class="page-intro">
        <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</p>
        <h1>{{ page.title }}</h1>
        {% if page.description %}
          <p>{{ page.description }}</p>
        {% endif %}
      </header>
      {{ content }}
    </article>
  </main>
  <script src="{{ '/js/script.js?v=20260527-theme2' | relative_url }}"></script>
</body>
</html>
